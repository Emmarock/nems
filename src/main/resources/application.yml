spring:
  application:
    name: nitel-estate

  datasource:
    # Individual fields (not one NITEL_DB_URL) so Render's Blueprint can wire each one straight
    # from the managed Postgres instance's `host`/`port`/`database`/`user`/`password` properties
    # without needing a jdbc:postgresql:// URI built by hand - see render.yaml.
    url: jdbc:postgresql://${NITEL_DB_HOST:localhost}:${NITEL_DB_PORT:55432}/${NITEL_DB_NAME:nitel_estate}
    username: ${NITEL_DB_USER:nitel}
    password: ${NITEL_DB_PASSWORD:nitel}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    # db/dev-seed (five login accounts sharing one known password, a fake demo resident) is
    # deliberately included here but excluded in application-prod.yml's override - it must never
    # run against a real database. See db/dev-seed/V4__seed_dev_data.sql.
    locations: classpath:db/migration,classpath:db/dev-seed
    baseline-on-migrate: true

server:
  # Render (and most PaaS hosts) assign the listen port via a PORT env var rather than letting
  # you pick one - falls back to 8080 for local/Docker runs where nothing sets it.
  port: ${PORT:8080}
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

nitel:
  app:
    # Used to build links in emails (e.g. "log in" in the account-provisioned message) - the
    # frontend and backend are the same origin in this monolith deploy, so the backend's own
    # public URL is also the frontend's. RENDER_EXTERNAL_URL is set automatically by Render for
    # every web service, so production needs no extra configuration; APP_BASE_URL overrides it
    # (e.g. behind a custom domain), and local/dev falls back to the Vite dev server.
    base-url: ${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:5173}}
  security:
    jwt:
      # Dev-only default secret. Override via NITEL_JWT_SECRET env var in real deployments.
      secret: ${NITEL_JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
      expiration-minutes: 480
  cors:
    # Wildcard patterns cover ngrok tunnels used to test on a phone (the free tier assigns a new
    # random subdomain every restart, so a fixed hostname would need editing here every time).
    allowed-origins: ${NITEL_CORS_ORIGINS:http://localhost:5173,https://*.ngrok-free.dev,https://*.ngrok-free.app}
  notifications:
    # WhatsApp goes through Twilio's Messages API; SMS does too UNLESS bulksms.api-token below is
    # set, in which case BulkSmsNigeriaSender takes over the SMS channel instead (see
    # TwilioSmsSender's ConditionalOnMissingBean). Leave unset for local/dev - the senders fall
    # back to logging instead of calling out. See TwilioSmsSender / TwilioWhatsAppSender for
    # exactly what "unset" means (blank, not absent).
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      sms-from: ${TWILIO_SMS_FROM:}
      # Plain E.164 number, no "whatsapp:" prefix - the sender adds that. Twilio's sandbox number
      # (shown in the console under Messaging > Try it out > WhatsApp) works for testing before
      # your own WhatsApp sender is Meta-approved.
      whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    # SMS via BulkSMSNigeria (https://www.bulksmsnigeria.com/app/api/docs) - wins over Twilio for
    # the SMS channel whenever api-token is set. "otp" gateway is used automatically for
    # transactional sends (e.g. the claim-account verification code); everything else uses
    # `gateway` below. sender-id is capped at 11 characters by the provider.
    bulksms:
      api-token: ${BULKSMS_API_TOKEN:}
      sender-id: ${BULKSMS_SENDER_ID:NitelEstate}
      gateway: ${BULKSMS_GATEWAY:direct-corporate}
      base-url: ${BULKSMS_BASE_URL:https://www.bulksmsnigeria.com/api/v2}
    # Email via Resend.
    resend:
      api-key: ${RESEND_API_KEY:}
      from-email: ${RESEND_FROM_EMAIL:noreply@nitelestate.com}
      from-name: ${RESEND_FROM_NAME:Nitel Estate Management System}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}

logging:
  level:
    com.cyrev.nitelestate: DEBUG
    org.hibernate.SQL: WARN
